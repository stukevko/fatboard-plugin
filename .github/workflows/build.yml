name: Build Fatboard plugins

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore: [ '**.md', 'docs/**' ]
  workflow_dispatch:
    inputs:
      mac:
        description: "Also build macOS (slow, ~20 min)"
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Push to main → Windows only (fast). macOS on tags or when started by hand.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          WIN='{"os":"windows-latest","name":"Windows"}'
          MAC='{"os":"macos-latest","name":"macOS"}'
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.mac }}" == "true" ]]; then
            echo "matrix={\"include\":[$WIN,$MAC]}" >> $GITHUB_OUTPUT
          else
            echo "matrix={\"include\":[$WIN]}" >> $GITHUB_OUTPUT
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # JUCE + unchanged plugin code don't get recompiled every run
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            build
            !build/**/*_artefacts
          key: build-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            build-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt') }}-

      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else echo "version=0.0.${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT; fi

      - name: Configure
        shell: bash
        run: |
          LTO=OFF; [[ "$GITHUB_REF" == refs/tags/v* ]] && LTO=ON
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DFATBOARD_LTO=$LTO

      - name: Build
        run: cmake --build build --config Release --target Scrub_All ScrubPro_All Harun_All Spit_All Smash_All Korrent_All --parallel

      # ---------------- Windows: stage, zip, Inno Setup installer ----------------
      - name: Stage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          foreach ($t in "Scrub","ScrubPro","Harun","Spit","Smash","Korrent") {
            Copy-Item -Recurse "build/${t}_artefacts/Release/VST3/*" out/
            Copy-Item -Recurse "build/${t}_artefacts/Release/Standalone/*" out/
          }
          Compress-Archive -Path out/* -DestinationPath "Fatboard-Windows-${{ steps.v.outputs.version }}.zip"

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DVersion=${{ steps.v.outputs.version }} /DStageDir=..\..\out installers\windows\fatboard.iss
          Copy-Item installers/windows/out/*.exe .

      # ---------------- macOS: stage + zip (installed via `curl … | sh`) --------
      - name: Stage (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          for t in Scrub ScrubPro Harun Spit Smash Korrent; do
            cp -R build/${t}_artefacts/Release/VST3/* out/
            cp -R build/${t}_artefacts/Release/AU/* out/
            cp -R build/${t}_artefacts/Release/Standalone/* out/
          done
          # ad-hoc signature on every bundle (no Apple account needed; Apple Silicon wants one)
          for b in out/*.vst3 out/*.component out/*.app; do codesign --force --deep --sign - "$b"; done
          # the installer travels inside the zip: unzip, then `sh install.sh`
          cp installers/mac/install.sh out/install.sh
          printf '%s\n' "Fatboard for Mac" "" "1. Open the Terminal app." "2. Type:  sh   (then a space)" "3. Drag the file install.sh from this folder into the Terminal window." "4. Press Enter. Restart your DAW." > out/READ-ME.txt
          # per-plugin zips for `FATBOARD_ONLY=…` + one bundle
          (cd out && zip -qr ../Fatboard-scrub-mac.zip "Scrub.vst3" "Scrub.component")
          (cd out && zip -qr ../Fatboard-scrub-pro-mac.zip "Scrub Pro.vst3" "Scrub Pro.component")
          (cd out && zip -qr ../Fatboard-harun-mac.zip "Harun.vst3" "Harun.component")
          (cd out && zip -qr ../Fatboard-spit-mac.zip "Spit.vst3" "Spit.component")
          (cd out && zip -qr ../Fatboard-smash-mac.zip "Smash.vst3" "Smash.component")
          (cd out && zip -qr ../Fatboard-korrent-mac.zip "Korrent.vst3" "Korrent.component")
          (cd out && zip -qr "../Fatboard-macOS-${{ steps.v.outputs.version }}.zip" .)
          cp "Fatboard-macOS-${{ steps.v.outputs.version }}.zip" Fatboard-all-mac.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Fatboard-${{ matrix.name }}
          path: |
            Fatboard-*.zip
            Fatboard-Setup-*.exe

  # On a tag (v0.1.0 …) publish everything as a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
